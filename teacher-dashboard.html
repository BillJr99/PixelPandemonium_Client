<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pixel Pandemonium Teacher Dashboard</title>
  <link href="assets/css/drawingcanvas.css" rel="stylesheet">
  <script src="assets/js/pixel-pandemonium.js"></script>
</head>
<body>
  <table width="100%" border="0" cellspacing="0" cellpadding="4">
    <tr>
      <td colspan="9" class="topLevelBody">
        <div align="center">
          <span style="font-size:24px;"><strong>Pixel Pandemonium</strong></span> - Teacher Dashboard<br>
          <strong>Jeffrey L. Popyack/Drexel University, William M. Mongan/Ursinus College</strong>
        </div>
      </td>
    </tr>
  </table>
  <ul class="pp-nav">
    <li><a href="index.html">Pixel Pandemonium</a></li>
  </ul>
  <div class="page-wrap">
    <h1>Teacher Dashboard</h1>
    <div class="panel">
      <h2>Create an Instance</h2>
      <form id="createForm">
        <div class="form-grid">
          <label for="creationMode">Picture Source</label>
          <select id="creationMode">
            <option value="static">Configured picture</option>
            <option value="spec">Upload posterizer specs</option>
            <option value="image">Upload GIF/image</option>
          </select>
          <label for="pictureId">Picture</label>
          <select id="pictureId" required></select>
          <label for="instanceName">Instance Name</label>
          <input id="instanceName" placeholder="Optional unique name">
          <label for="customTitle">Custom Picture Title</label>
          <input id="customTitle" placeholder="My custom poster">
          <label for="specFiles">Posterizer Files</label>
          <input id="specFiles" type="file" multiple accept=".js,.csv,.txt,.html">
          <label for="imageFile">GIF/Image</label>
          <input id="imageFile" type="file" accept="image/gif,image/png,image/jpeg,image/webp">
          <label for="dimensionPreset">Output Dimensions</label>
          <select id="dimensionPreset"></select>
          <label for="customWidth">Custom Width</label>
          <input id="customWidth" type="number" min="1" step="1">
          <label for="customHeight">Custom Height</label>
          <input id="customHeight" type="number" min="1" step="1">
          <label for="paletteEditor">Palette</label>
          <textarea id="paletteEditor" rows="4" placeholder="One RGB color per line, for example: 255,255,255"></textarea>
          <span></span>
          <p>
            <button type="button" id="analyzeCustomButton">Analyze Custom Picture</button>
            <button type="button" id="remapPaletteButton">Remap Palette</button>
          </p>
          <label for="teacherName">Teacher Name</label>
          <input id="teacherName" required>
          <label for="dateTime">Date/Time</label>
          <input id="dateTime" type="datetime-local" required>
          <label for="expirationDays">Expiration Days</label>
          <input id="expirationDays" type="number" min="1" step="1" required>
        </div>
        <p><button type="submit">Create Instance</button></p>
      </form>
      <div id="customPictureStatus"></div>
      <canvas id="customPreviewCanvas" width="300" height="180" style="display:none; border:1px solid #999;"></canvas>
      <div id="createResult"></div>
    </div>

    <div class="panel">
      <h2>Reset an Instance</h2>
      <form id="resetForm">
        <div class="form-grid">
          <label for="resetInstanceCode">Instance Code</label>
          <input id="resetInstanceCode" required>
          <label for="resetAdminCode">Admin Code</label>
          <input id="resetAdminCode">
          <label for="resetTeacherKey">Teacher Key</label>
          <input id="resetTeacherKey">
        </div>
        <p><button type="submit">Reset Instance</button></p>
      </form>
      <div id="resetResult"></div>
    </div>

    <div class="panel">
      <h2>Existing Instances</h2>
      <p>
        <button type="button" id="loadInstancesButton">Load Instances</button>
        <button type="button" id="loadTetrisDemoButton">Load Tetris Demo</button>
      </p>
      <div id="instancesList"></div>
      <div id="dashboardAdminStatus"></div>
      <p>
        <label for="animationSource">Source</label>
        <select id="animationSource">
          <option value="instance">Instance data only</option>
          <option value="finished">Finished product, filling missing pixels</option>
        </select>
        <label for="animationOrder">Order</label>
        <select id="animationOrder">
          <option value="chronological">Student completion order</option>
          <option value="existing-then-sequential">Existing work, then sequential fill</option>
          <option value="random">Random order</option>
        </select>
        <button id="adminReplayButton" type="button">Animate Instance Data</button>
        <button id="adminFinishButton" type="button">Animate Finished Image</button>
      </p>
      <canvas id="drawCanvas" width="720" height="576" style="border:1px solid #000000;"></canvas>
      <div id="adminTileSummary"></div>
    </div>
  </div>
  <script>PixelPandemonium.initDashboard();</script>
</body>
</html>
