name: CI

on:
  push:
  pull_request:

# The smoke and Playwright browser tests require a running Pixel Pandemonium
# server, which lives in a separate (private) repository, so they cannot run in
# this single-repo CI. They are run locally via `npm run test:all`. CI here is
# limited to checks that do not need the server: JS syntax, structural assertions,
# and a Jekyll build.
jobs:
  static:
    name: Static checks + Jekyll build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check client JS
        run: node --check assets/js/pixel-pandemonium.js

      - name: Structural assertions
        run: |
          set -euo pipefail
          # Core pages and assets exist.
          for f in index.html create-instance.html teacher-dashboard.html \
                   instructions.html replay.html admin.html \
                   assets/js/pixel-pandemonium.js assets/css/drawingcanvas.css; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          # Key UI/JS markers are present.
          grep -q "tileSelectorCanvas" instructions.html
          grep -q "Create Instance" create-instance.html
          grep -q "adminCreateForm" admin.html
          grep -q "initStudent" assets/js/pixel-pandemonium.js
          grep -q "initAdmin" assets/js/pixel-pandemonium.js
          grep -q "analyzeCustomPicture" assets/js/pixel-pandemonium.js
          grep -q "parseCompositeJs" assets/js/pixel-pandemonium.js
          # Multi-letter posterizer column labels stay handled (base-26 helpers
          # replaced the single-letter charCodeAt mapping that broke >26-column
          # composites and gapped label sets).
          grep -q "columnLabelToIndex" assets/js/pixel-pandemonium.js
          grep -q "normalizePageGrid" assets/js/pixel-pandemonium.js
          ! grep -q 'page.col.charCodeAt(0) - "A".charCodeAt(0)' assets/js/pixel-pandemonium.js
          # Built-in picture preview and instance-list management actions exist.
          grep -q "previewBuiltInPicture" assets/js/pixel-pandemonium.js
          grep -q "delete-instance" assets/js/pixel-pandemonium.js
          grep -q "set-expiration" assets/js/pixel-pandemonium.js
          test -f tests/fixtures/Post-It_multicol_composite.csv
          test -f tests/fixtures/ColorMap_multicol.txt
          # Picture catalog has moved to the server: the client fetches it and no
          # longer carries a catalog or picture files.
          grep -q "loadPictures" assets/js/pixel-pandemonium.js
          ! grep -q "function findPicture" assets/js/pixel-pandemonium.js
          ! grep -qE "^pictures:" config.yaml
          test ! -d files
          test -f tests/fixtures/Post-It_tetris_composite.js
          test -f tests/fixtures/tetris.gif
          test -f tests/fixtures/ColorMap_tetris.txt

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Jekyll build
        run: bundle exec jekyll build
