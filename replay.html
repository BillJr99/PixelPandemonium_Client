<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pixel Pandemonium Replay</title>
  <link href="assets/css/drawingcanvas.css" rel="stylesheet">
  <script src="assets/js/pixel-pandemonium.js"></script>
</head>
<body>
  <table width="100%" border="0" cellspacing="0" cellpadding="4">
    <tr>
      <td colspan="9" class="topLevelBody">
        <div align="center">
          <span style="font-size:24px;"><strong>Pixel Pandemonium</strong></span><br>
          <strong id="pictureTitle"></strong> <span class="mono" id="instanceCode"></span>
        </div>
      </td>
    </tr>
  </table>
  <ul class="pp-nav">
    <li><a href="index.html">Pixel Pandemonium</a></li>
    <li><a href="teacher-dashboard.html">Teacher Dashboard</a></li>
    <li><a href="admin.html">Administrator Dashboard</a></li>
  </ul>
  <ul class="pp-subnav">
    <li class="pp-nav-control">
      <label for="replayOrder">Order</label>
      <select id="replayOrder">
        <option value="chronological">Sequential</option>
        <option value="random">Random</option>
      </select>
    </li>
    <li class="pp-nav-control">
      <label for="replayDelayMs">Delay</label>
      <input id="replayDelayMs" type="number" min="0" step="1" value="5">
      <span>ms</span>
    </li>
    <li><button id="replayButton" type="button">Replay From Empty</button></li>
    <li><button id="finishButton" type="button">Auto Finish</button></li>
  </ul>
  <div class="page-wrap">
    <div id="canvascontainer">
      <div id="maincanvascontainer">
        <canvas id="drawCanvas" width="720" height="576" style="border:1px solid #000000;"></canvas>
      </div>
    </div>
  </div>
  <script>PixelPandemonium.initReplay();</script>
</body>
</html>
